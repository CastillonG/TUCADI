function filteredTechnicians() {
  const { search, svc, zone, rating } = S.list;
  return TECHNICIANS.filter(t => {
    if (search && !t.name.toLowerCase().includes(search.toLowerCase()) && !t.description.toLowerCase().includes(search.toLowerCase())) return false;
    if (svc && !t.services.includes(svc)) return false;
    if (zone && t.zone !== zone) return false;
    if (rating && t.rating < parseFloat(rating)) return false;
    return true;
  });
}

// ─── APP RENDER ──────────────────────────────────────────────────────────────────
function pageHTML() {
  switch (S.page) {
    case "home": return HomeHTML();
    case "how": return HowHTML();
    case "list": return ListHTML();
    case "profile": return ProfileHTML();
    case "eval": return RequestHTML();
    case "signup": return SignupHTML();
    default: return HomeHTML();
  }
}

function renderApp() {
  const root = document.getElementById("root");

  if (S.auth.loading) {
    root.innerHTML = `<div class="login-gate"><div style="color:white;font-family:var(--fd);font-size:16px">Cargando…</div></div>`;
    return;
  }

  if (!S.auth.user) {
    root.innerHTML = LoginGateHTML();
    const btn = document.getElementById("googleSignInBtn");
    if (btn) btn.addEventListener("click", doGoogleSignIn);
    return;
  }

  root.innerHTML = `${NavHTML()}<main>${pageHTML()}</main>${FooterHTML()}`;

  const menuBtn = document.getElementById("userMenuBtn");
  if (menuBtn) menuBtn.addEventListener("click", (e) => { e.stopPropagation(); S.auth.menuOpen = !S.auth.menuOpen; renderApp(); });
  const signOutBtn = document.getElementById("signOutBtn");
  if (signOutBtn) signOutBtn.addEventListener("click", doSignOut);
}

// ─── PARTIAL UPDATES ─────────────────────────────────────────────────────────────
function updateTechResults() {
  const el = document.getElementById("techResults");
  if (el) el.innerHTML = TechResultsHTML();
}

// ─── EVENT DELEGATION ────────────────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  if (S.auth.menuOpen && !e.target.closest("#userMenuBtn") && !e.target.closest(".user-menu")) {
    S.auth.menuOpen = false;
    renderApp();
  }

  const navEl = e.target.closest("[data-nav]");
  if (navEl) {
    const target = navEl.getAttribute("data-nav");
    const idAttr = navEl.getAttribute("data-id");
    nav(target, idAttr ? parseInt(idAttr, 10) : null);
    return;
  }

  const reqJobEl = e.target.closest("[data-toggle-request-job]");
  if (reqJobEl) {
    const jobId = reqJobEl.getAttribute("data-toggle-request-job");
    S.request.selectedJob = S.request.selectedJob === jobId ? null : jobId;
    renderApp();
    return;
  }

  const toggleJobEl = e.target.closest("[data-toggle-job]");
  if (toggleJobEl) {
    const jobId = toggleJobEl.getAttribute("data-toggle-job");
    S.profile.selJob = S.profile.selJob === jobId ? null : jobId;
    renderApp();
    return;
  }

  const waContactEl = e.target.closest("[data-wa-contact]");
  if (waContactEl) {
    const techId = parseInt(waContactEl.getAttribute("data-wa-contact"), 10);
    const tech = TECHNICIANS.find(t => t.id === techId);
    if (!tech) return;
    const job = tech.jobs.find(j => j.id === S.request.selectedJob) || null;
    const desc = document.getElementById("reqDesc")?.value || "";
    window.open(buildWaLink(tech, job, desc), "_blank", "noopener");
    return;
  }

  const filterToggleEl = e.target.closest("[data-filter-toggle]");
  if (filterToggleEl) {
    S.list.open = !S.list.open;
    renderApp();
    return;
  }

  const filterClearEl = e.target.closest("[data-filter-clear]");
  if (filterClearEl) {
    S.list.search = "";
    S.list.svc = "";
    S.list.zone = "";
    S.list.rating = "";
    renderApp();
    return;
  }

  const svcToggleEl = e.target.closest("[data-service-toggle]");
  if (svcToggleEl) {
    svcToggleEl.classList.toggle("selected");
    if (svcToggleEl.id === "svcOtherToggle") {
      const otherInput = document.getElementById("svcOtherInput");
      if (otherInput) {
        const show = svcToggleEl.classList.contains("selected");
        otherInput.style.display = show ? "block" : "none";
        if (show) otherInput.focus();
        else otherInput.value = "";
      }
    }
    return;
  }

  const catSelectEl = e.target.closest("[data-category-select]");
  if (catSelectEl) {
    // Solo hay una categoría activa por ahora (Aire acondicionado); no hace falta alternar.
    return;
  }
});

document.addEventListener("input", (e) => {
  if (e.target.matches("[data-list-search]")) {
    S.list.search = e.target.value;
    updateTechResults();
  }
});

document.addEventListener("change", (e) => {
  if (e.target.matches("[data-list-svc]")) { S.list.svc = e.target.value; renderApp(); }
  if (e.target.matches("[data-list-zone]")) { S.list.zone = e.target.value; renderApp(); }
  if (e.target.matches("[data-list-rating]")) { S.list.rating = e.target.value; renderApp(); }
});

document.addEventListener("submit", async (e) => {
  if (e.target.id !== "signupForm") return;
  e.preventDefault();

  const form = e.target;
  const submitBtn = form.querySelector('button[type="submit"]');
  let selectedServices = Array.from(form.querySelectorAll("[data-service-toggle].selected"))
    .map(b => b.getAttribute("data-service-toggle"));
  const otherText = form.serviceOther ? form.serviceOther.value.trim() : "";
  if (selectedServices.includes("Otro")) {
    selectedServices = selectedServices.filter(s => s !== "Otro");
    if (otherText) selectedServices.push(otherText);
  }
  const selectedZones = Array.from(form.querySelectorAll('input[name="zone"]:checked')).map(cb => cb.value);

  if (selectedZones.length === 0) {
    alert("Selecciona al menos una zona de cobertura.");
    return;
  }

  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "Enviando..."; }

  try {
    await addDoc(collection(db, "tecnicos"), {
      name: form.name.value.trim(),
      business: form.business.value.trim(),
      phone: form.phone.value.trim(),
      experience: form.experience.value,
      category: form.category.value,
      services: selectedServices,
      zones: selectedZones,
      description: form.description.value.trim(),
      status: "pendiente",
      createdAt: serverTimestamp(),
      submittedBy: auth.currentUser ? auth.currentUser.uid : null,
    });
    S.signup.done = true;
    renderApp();
  } catch (err) {
    console.error("Error guardando registro en Firestore:", err);
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = "Enviar solicitud →"; }
    alert("No se pudo enviar tu registro. Revisa tu conexión e intenta de nuevo.");
  }
});
